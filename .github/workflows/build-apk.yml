name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHARQ_STORE_PASSWORD: ${{ secrets.SHARQ_STORE_PASSWORD }}
      SHARQ_KEY_PASSWORD: ${{ secrets.SHARQ_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set version code from build number
        working-directory: android
        run: sed -i "s/^\(\s*\)versionCode 1/\1versionCode ${{ github.run_number }}/" app/build.gradle && grep -n "versionCode" app/build.gradle

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SHARQ_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/souq-alsharq.keystore
          ls -la android/app/souq-alsharq.keystore

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souq-alsharq-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
